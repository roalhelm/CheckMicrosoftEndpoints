name: Update Microsoft service status

# Fallback data for the "Microsoft service status" banner on the web page.
# The page reads status.cloud.microsoft live when the browser allows it; this file is used otherwise.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  actions: write # needed to start the Pages deploy after a real change

concurrency:
  group: ms-status
  cancel-in-progress: false

jobs:
  update-ms-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Microsoft service status
        run: node tools/fetch-ms-status.mjs

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- web/data/ms-status.generated.json && git ls-files --error-unmatch web/data/ms-status.generated.json >/dev/null 2>&1; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ms-status.generated.json
          git commit -m "chore: refresh Microsoft service status"
          git pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploy only when the status file was actually committed. A push made with
      # GITHUB_TOKEN does not trigger the push event of other workflows, so the
      # deploy is started explicitly via workflow_dispatch.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
