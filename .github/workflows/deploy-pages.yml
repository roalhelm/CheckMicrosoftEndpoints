name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "CheckMicrosoftEndpointsV2.ps1"
      - "CheckMEMEndpoints.ps1"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update endpoint data", "Update Microsoft service status"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add PowerShell scripts for download
        run: |
          mkdir -p web/scripts
          cp CheckMicrosoftEndpointsV2.ps1 CheckMEMEndpoints.ps1 web/scripts/

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
